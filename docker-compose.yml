# Standalone stack for THIS service: MySQL + backend + frontend + the mock agencies + the sidecar.
# Useful for working on the service without booting all 23 containers of the system.
#
#   docker compose up --build
#   → http://localhost:9000   the SIDECAR — send applications, watch what comes back
#   → http://localhost:5173   React UI    http://localhost:8080/  status page
#   → http://localhost:8081   the MOCK IDENTITY AGENCIES — turn one off, watch the module cope
#
# In the full system, neo-00/docker-compose.yml supplies the shared MySQL and the REAL
# orchestrator instead, and this file is not used.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-neo_03}
      MYSQL_USER: ${DB_USERNAME:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppass}
    ports:
      # Host 3307 so it never clashes with a locally installed MySQL. Services inside
      # compose reach the DB as mysql:3306 regardless.
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the sidecar's schema and grants appuser. MySQL runs these ONLY on a fresh data
      # directory — if you had this stack up before the sidecar existed, run
      # `docker compose down -v` once or the sidecar cannot reach its schema.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/neo_03}
      DB_USERNAME: ${DB_USERNAME:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      SERVICE_ID: ${SERVICE_ID:-neo03}
      SERVICE_NAME: ${SERVICE_NAME:-Identity Verification (KYC)}
      SERVICE_DOMAIN: ${SERVICE_DOMAIN:-kyc}
      MOCKED_DEPENDENCIES: ${MOCKED_DEPENDENCIES:-national-identity-agency,tax-agency}
      # The identity sources. Same port (8081) here and on AWS, where the mock runs as a third
      # container in the SAME ECS task and is reached on 127.0.0.1:8081.
      ID_PROVIDER_BASE_URL: ${ID_PROVIDER_BASE_URL:-http://mock-integration:8081}
      # The sidecar plays the orchestrator here, so callbacks have somewhere real to land and
      # you can see BOTH halves of the contract. Point this at http://orchestrator:8080 to talk
      # to the real one instead — nothing else in the module changes.
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://sidecar:8080}
      # Any localhost port by default — see WebConfig for why a fixed list breaks the UI.
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      # service_started, NOT service_healthy — deliberately, to mirror ECS, which has no
      # DependsOn at all. A backend that cannot boot without the provider would fail on Fargate,
      # where that dependency cannot be expressed. The module must survive its provider being
      # absent: an outage parks applications for a human, it does not stop the module.
      mock-integration:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # The mocked government identity sources: a National Identity Agency (primary) and a Tax
  # Agency (fallback). This is what the module calls instead of rolling dice.
  #
  # Stateless — no MySQL dependency, nothing in db/init, nothing to reset. It is the SAME image
  # that runs as a third container in the same ECS task on dev and prod, on the same port, so
  # what you see here is what runs there.
  #
  # Open http://localhost:8081 to turn an agency off and watch the retry ladder, the failover
  # and the circuit breaker do their work.
  mock-integration:
    build: ./mock-integration
    environment:
      SERVER_PORT: 8081
      # Boot with an agency already down, for a demo that starts broken:
      #   AGENCY_KILL_SWITCH=true docker compose up
      AGENCY_LATENCY_MS: ${AGENCY_LATENCY_MS:-0}
      AGENCY_FAILURE_RATE_PCT: ${AGENCY_FAILURE_RATE_PCT:-0}
      AGENCY_KILL_SWITCH: ${AGENCY_KILL_SWITCH:-false}
    ports:
      - "${MOCK_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # The mock orchestrator: sends applications to your module and receives its callback.
  #
  # Built straight from its own public repo — there is NO sidecar source in this repo, nothing
  # to drift, and nothing for you to maintain. The first build takes a few minutes; after that
  # it is cached until the sidecar itself changes. Pick up a new version with:
  #   docker compose up --build sidecar
  #
  # Do not replace this with a local path or a vendored copy. One repo, one copy — that is what
  # stops ten teams ending up with ten different mock orchestrators.
  sidecar:
    build: https://github.com/Neueda-Learning/neobank-sidecar.git#${SIDECAR_REF:-v1}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sidecar_db
      DB_USERNAME: ${DB_USERNAME:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      # Where to send applications. Also overridable per send from the sidecar's own page, which
      # is what you want when your backend runs in your IDE rather than in here.
      MODULE_URL: ${MODULE_URL:-http://backend:8080}
    ports:
      # 9000 on purpose: the module's ORCHESTRATOR_URL already defaults to localhost:9000, so a
      # backend you run from your IDE finds the sidecar with no configuration at all.
      - "${SIDECAR_PORT:-9000}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
