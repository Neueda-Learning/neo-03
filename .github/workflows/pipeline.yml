name: Pipeline

# ONE pipeline per repo. This repo deploys only its OWN service; the shared platform is
# deployed separately from a laptop (infra/platform.yaml + roles.yaml).
#
# Trunk-based, so many branches during the hackathon never fight over the single dev stack:
#   push to a FEATURE branch → build + test only (VERIFY). Nothing is published or deployed.
#   push to MAIN (i.e. a branch merged back) → build + test → publish (pinned @sha256) →
#                       deploy DEV → smoke → record the pinned digest in SSM (the promote source)
#   Run workflow, promote=true → PROD deploy is REQUESTED, then PAUSES for a required
#                                reviewer to approve; on approval it ships the exact digest
#                                main put on dev. NO rebuild — it ships the bytes dev proved.
#
# So dev only ever moves when something lands on main; feature branches just prove they build.
# Prod's gate (in order): (1) manual promote input, (2) main-only — the SSM pin is written only
# on main, deploy-prod has a `github.ref == main` guard, and the prod environment's
# deployment-branch policy allows only main, (3) a REQUIRED REVIEWER on the `prod` environment
# (repos are public, so this GitHub-native approval is available) — deploy-prod pauses until a
# human approves in the Actions UI.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "infra/services.sh", "infra/db-reset.sh"]
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote main's current dev build to prod (no rebuild)"
        type: boolean
        default: false

permissions:
  id-token: write     # OIDC — assume this repo's per-repo deploy role
  contents: read
  packages: write     # push images to ghcr.io

# Per-ref: feature branches verify in parallel (they don't deploy), while pushes to the SAME ref
# — notably main, the only ref that deploys — queue instead of colliding on the shared dev stack.
# Never cancel a half-done deploy.
concurrency:
  group: neobank-${{ github.event.repository.name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Images live under the ORG namespace, lower-cased: ghcr.io/neueda-learning/<repo>-*.
  # ghcr.io rejects uppercase repository paths and the org's display name has capitals,
  # so the base is folded once in the `img` step below rather than written out here.
  REGISTRY: ghcr.io

jobs:
  # ---- VERIFY (every push, ANY branch) — this is all a feature branch does ------------
  backend:
    name: build · backend (unit + DB integration tests)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B verify   # CI=true → also the Testcontainers real-MySQL test

  frontend:
    name: build · UI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # The mocked identity agencies. Stateless, so no Docker and no Testcontainers here —
  # `verify` and `test` are the same thing in that module.
  mock-integration:
    name: build · mock identity agencies
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mock-integration } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B verify

  # ---- PUBLISH (MAIN only): pinned @sha256 digests are this job's outputs ---------------
  publish:
    name: publish · images to ghcr.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, mock-integration]
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.refs.outputs.backend }}
      frontend: ${{ steps.refs.outputs.frontend }}
      mock: ${{ steps.refs.outputs.mock }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The front end is served under a path prefix by the ALB, baked into the image at build
      # time (Vite writes asset URLs then). Single-source it from the service params so the
      # image and the PathPrefix parameter can never drift.
      - id: prefix
        run: echo "value=$(sed -n 's/^PathPrefix=//p' infra/env/dev.params)" >> "$GITHUB_OUTPUT"

      # GHCR rejects uppercase repository paths, and `github.repository` carries the owner's
      # DISPLAY casing — `Neueda-Learning`, with capitals. Tags are hand-written here rather
      # than produced by docker/metadata-action, which would have lowercased them, so the
      # owner is folded to lower case once and reused by every tag below.
      - id: img
        run: echo "base=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build + push backend
        id: be
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-backend:latest
            ${{ steps.img.outputs.base }}-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain manifest, not an attestation index: we pin prod to the digest, and
          # provenance turns that digest into an index ECS cannot pull.
          provenance: false

      - name: Build + push frontend
        id: fe
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-frontend:latest
            ${{ steps.img.outputs.base }}-frontend:sha-${{ github.sha }}
          build-args: |
            APP_BASE_PATH=${{ steps.prefix.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build + push the mock identity agencies
        id: mk
        uses: docker/build-push-action@v6
        with:
          context: ./mock-integration
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-mock-integration:latest
            ${{ steps.img.outputs.base }}-mock-integration:sha-${{ github.sha }}
          # Its own cache scope. The other two share the default one; a third build joining
          # them would evict their layers on every run rather than speed anything up.
          cache-from: type=gha,scope=mock
          cache-to: type=gha,mode=max,scope=mock
          provenance: false

      # The immutable refs everything downstream deploys — dev now, prod on promote.
      - id: refs
        run: |
          echo "backend=${{ steps.img.outputs.base }}-backend@${{ steps.be.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ steps.img.outputs.base }}-frontend@${{ steps.fe.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "mock=${{ steps.img.outputs.base }}-mock-integration@${{ steps.mk.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---- DEPLOY DEV (MAIN only) ----------------------------------------------------------
  deploy-dev:
    name: deploy · dev
    needs: [backend, frontend, mock-integration, publish]
    # Runs on a push once the build passed and dev is enabled. A pinned @sha256 param IS a
    # template change, so CloudFormation rolls the task definition itself — no force-deploy.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && !failure() && vars.DEV_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy this service to dev
        env: { AWS_REGION: "${{ vars.AWS_REGION }}" }
        run: >
          bash infra/deploy-service.sh dev
          '${{ needs.publish.outputs.backend }}'
          '${{ needs.publish.outputs.frontend }}'
          '${{ needs.publish.outputs.mock }}'

      # The mock has no target group and no listener rule, so `smoke` structurally CANNOT see
      # it: if the template's Fn::If silently dropped the container, everything below would go
      # green against a two-container task whose backend calls a dead 127.0.0.1:8081. This is
      # the only step that proves the third container actually landed.
      - name: The task definition must carry the mock container
        run: |
          set -euo pipefail
          SVC=$(sed -n 's/^ServiceName=//p' infra/env/dev.params)
          # --output text joins list elements with TABS, not spaces — the case pattern below
          # matches on spaces, so without this the check false-negatives on every deploy
          # even when mock-integration is correctly present (confirmed: it always was).
          NAMES=$(aws ecs describe-task-definition --task-definition "neobank-dev-$SVC" \
                    --query 'taskDefinition.containerDefinitions[].name' --output text | tr '\t' ' ')
          echo "containers: $NAMES"
          case " $NAMES " in
            *" mock-integration "*) echo "ok: 3-container task" ;;
            *) echo "::error::mock-integration missing from neobank-dev-$SVC"; exit 1 ;;
          esac

  # ---- SMOKE (MAIN only): after the main deploy, prove dev answers through the ALB --------
  smoke:
    name: smoke · dev health
    needs: deploy-dev
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && needs.deploy-dev.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev   # so vars.AWS_* resolve to the dev environment's role ARN
    steps:
      - uses: actions/checkout@v4
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: This service must answer through the ALB
        run: |
          set -euo pipefail
          ALB=$(aws ssm get-parameter --name "/neobank/dev/alb-dns" --query Parameter.Value --output text)
          PREFIX=$(sed -n 's/^PathPrefix=//p' infra/env/dev.params)
          BASE="http://$ALB$PREFIX"
          for i in $(seq 1 60); do curl -sf "$BASE/health" >/dev/null && break; sleep 5; done
          curl -sf "$BASE/health"
          curl -sf "$BASE/" | grep -qi '<div id="root">'
          echo "dev is up at $BASE/"

  # ---- PIN (main only): record the promote source ------------------------------------
  pin-main:
    name: pin · record main's digest for promote
    needs: [publish, deploy-dev]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && needs.deploy-dev.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Record what dev is running (main) as the promote source
        run: |
          set -euo pipefail
          R="${{ github.event.repository.name }}"
          aws ssm put-parameter --overwrite --type String \
            --name "/neobank/promote/$R/backend"  --value '${{ needs.publish.outputs.backend }}'
          aws ssm put-parameter --overwrite --type String \
            --name "/neobank/promote/$R/frontend" --value '${{ needs.publish.outputs.frontend }}'
          aws ssm put-parameter --overwrite --type String \
            --name "/neobank/promote/$R/mock-integration" --value '${{ needs.publish.outputs.mock }}'
          echo "pinned $R promote source to main's digest"

  # ---- PROMOTE → PROD (manual only): ship the pinned digest, NO rebuild ----------------
  deploy-prod:
    name: deploy · prod (promote)
    # Promote ONLY from main. Layer 1: the promote source is an SSM pin written only by the
    # pin-main job (main-only), so the image is always a main build regardless. Layer 2 (this
    # ref check): the promote must also be DISPATCHED from main, so a feature branch's infra
    # template/params can't be used for a prod deploy either. A `prod` environment
    # deployment-branch policy (main only) is the GitHub-enforced backstop — see infra/README.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote && github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Promote main's dev digest to prod
        env: { AWS_REGION: "${{ vars.AWS_REGION }}" }
        run: |
          set -euo pipefail
          R="${{ github.event.repository.name }}"
          BACKEND=$(aws ssm get-parameter --name "/neobank/promote/$R/backend"  --query Parameter.Value --output text)
          FRONTEND=$(aws ssm get-parameter --name "/neobank/promote/$R/frontend" --query Parameter.Value --output text)
          # Read TOLERANTLY. This pin does not exist until the first pin-main run after the mock
          # was added, and a bare get-parameter exits 255 on a missing name — under `set -e` that
          # kills the promote outright. An empty value deploys prod without the mock container,
          # which is exactly what prod is running today, so it degrades rather than breaks.
          MOCK=$(aws ssm get-parameter --name "/neobank/promote/$R/mock-integration" \
                   --query Parameter.Value --output text 2>/dev/null || echo "")
          [ -n "$MOCK" ] || echo "::warning::no mock-integration pin for $R — prod will deploy WITHOUT the identity agencies, and the backend will park every application. Run main first, then promote."
          echo "promoting $BACKEND"
          bash infra/deploy-service.sh prod "$BACKEND" "$FRONTEND" "$MOCK"
