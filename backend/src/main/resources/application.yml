spring:
  application:
    name: ${SERVICE_ID:neo03}

  # Dev defaults point at this repo's own docker-compose MySQL (host port 3307).
  # In the system stack (neo-00/docker-compose.yml) these are overridden by env.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/neo_03?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppass}
    hikari:
      # ELEVEN SERVICES SHARE ONE DATABASE, AND ITS CEILING IS 60 CONNECTIONS.
      #
      # Measured on the live RDS, not estimated: `SHOW VARIABLES LIKE 'max_connections'` on
      # the db.t4g.micro this platform runs = 60 (it derives from instance memory, and the
      # account's free plan blocks a bigger instance — see infra/env/platform-*.params).
      #
      # HikariCP's default pool is 10. Eleven of those is 110, and what happens at 60 is not
      # a queue: a service dies in Liquibase with "Too many connections", which reads as a
      # broken module rather than an exhausted shared budget. Worse, once it is saturated the
      # db-init task cannot connect to CREATE a schema either, so the failure spreads into
      # deploys.
      #
      # The budget: 10 modules × 3 + orchestrator 5 = 35, leaving ~25 for the db-init task
      # that runs on every deploy, the schema-reset workflow, and whoever has Workbench open.
      # Three is ample — a module holds a connection only for the row it writes, and its
      # call to the orchestrator happens OUTSIDE that transaction on purpose.
      #
      # Raising DB_POOL_SIZE takes from everyone else's share. Do the arithmetic in
      # infra/README.md § Connection budget first, and tell the instructor.
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1

  jpa:
    # Liquibase owns the schema; Hibernate only validates that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # The pool the decision runs on — Spring Boot's own `applicationTaskExecutor`, so there is no
  # bean to write. The thread-name prefix is what proves, in the logs, that your rules did NOT
  # run on the request thread:
  #   [nio-8080-exec-1]  RECEIVED SIM-01 …
  #   [module-worker-1]  DECIDED  SIM-01 -> ACCEPTED …
  # Raise the pool size if your rules call a slow mock — that is what limits how many
  # applications you can decide at once.
  task:
    execution:
      thread-name-prefix: module-worker-
      pool:
        core-size: ${WORKER_POOL_SIZE:8}

# Who this service is and how it behaves. Every value is env-overridable, which is how
# one image serves as all ten services in the system compose.
service:
  id: ${SERVICE_ID:neo03}
  name: ${SERVICE_NAME:Identity Verification (KYC)}
  # Who owns this module. Shown in the UI's identity box, so set it to your own team or the
  # next person to open the app will think they are looking at team 01's work.
  team: ${SERVICE_TEAM:Team 03}
  # BIAN domain this module owns — verification / policy / kyc / screening / credit /
  # agreement / account / card / support / analytics. Reported on /info.
  domain: ${SERVICE_DOMAIN:kyc}
  version: 0.1.0-SNAPSHOT
  # Where to POST the decision callback. Three things can be listening there:
  #   http://sidecar:8080        the mock orchestrator in this repo's compose (the default there)
  #   http://localhost:9000      that same sidecar, from a module you run in your IDE (this default)
  #   http://orchestrator:8080   the REAL orchestrator, in the neo-00 system stack
  # Nothing in the module changes between them — only this value.
  orchestrator-url: ${ORCHESTRATOR_URL:http://localhost:9000}
  # Comma-separated external systems this module fakes — the "what has been mocked" register,
  # served live on /info so it cannot go stale the way a paragraph in a document does. Empty
  # means you are claiming nothing is mocked.
  mocked-dependencies: ${MOCKED_DEPENDENCIES:national-identity-agency,tax-agency}

# The identity sources this module calls — the `mock-integration` service in this repo.
#
# It stands in for a National Identity Agency (primary) and a Tax Agency (fallback). Three things
# can be listening:
#   http://mock-integration:8081   this repo's compose (the default there)
#   http://localhost:8081          that same mock, from a backend you run in your IDE (this default)
#   http://127.0.0.1:8081          the SAME ECS TASK on AWS — awsvpc gives one network namespace
#                                  per task, exactly like nginx reaching the backend
id-provider:
  base-url: ${ID_PROVIDER_BASE_URL:http://localhost:8081}

  # How long ONE attempt may take before it counts as a timeout.
  #
  # Load-bearing: without it a provider that accepts the connection and then hangs holds a worker
  # thread until the OS gives up — minutes — and the retry ladder never gets to run at all. Armed
  # on a SEPARATE RestClient (see config/AppConfig.java) so the orchestrator callback does not
  # inherit it.
  timeout-ms: ${ID_PROVIDER_TIMEOUT_MS:2000}

  # The retry ladder against the PRIMARY. 3 attempts, waiting 1s then 2s between them.
  # The fallback deliberately gets one attempt and no budget of its own.
  max-attempts: ${ID_PROVIDER_MAX_ATTEMPTS:3}
  backoff-ms: ${ID_PROVIDER_BACKOFF_MS:1000,2000}

  # THRESHOLDS ARE COMPLIANCE POLICY, SHIPPED AS CONFIGURATION.
  # >= accept verifies, <= reject fails, strictly between parks for a human. Both boundaries are
  # inclusive on their own side, so no score falls through both tests. Startup fails if reject is
  # not below accept — inverted thresholds silently empty the review band rather than throwing.
  accept-threshold: ${ID_PROVIDER_ACCEPT_THRESHOLD:92}
  reject-threshold: ${ID_PROVIDER_REJECT_THRESHOLD:60}

  # The circuit breaker. After this many CONSECUTIVE failures the module stops calling that agency
  # entirely and fails fast, then lets one trial call through once the cooldown has elapsed.
  # Without it, a one-hour outage costs every single application the full ladder — ~10s of worker
  # thread each — to re-learn a fact the last hundred applications already established.
  breaker:
    failure-threshold: ${ID_PROVIDER_BREAKER_THRESHOLD:5}
    cooldown-ms: ${ID_PROVIDER_BREAKER_COOLDOWN_MS:30000}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  # Never leak a stack trace — GlobalExceptionHandler returns a controlled JSON shape.
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    liquibase: INFO
