# The attempt log grows up: it now records WHICH identity source was called, WHEN the call went
# out, and how long it took. Before this the module had no real provider, so there was only ever
# one source and nothing to distinguish.
#
# APPEND-ONLY, as this changelog's master file says. 003 and 004 are applied on dev and in every
# running database — editing either would change its checksum and Liquibase would refuse to start
# the service, which reads as a broken deploy rather than an edited migration.
databaseChangeLog:
  - changeSet:
      id: 005-add-attempt-provider-columns
      author: neo-03
      changes:
        - addColumn:
            tableName: third_party_attempts
            columns:
              # NATIONAL or TAX. Nullable: rows written before there were two sources cannot
              # answer this, and inventing a backfill value would assert something untrue about
              # calls that were never made over a network at all.
              - column:
                  name: agency
                  type: VARCHAR(32)
              # When the call went out — NOT when the row was saved.
              #
              # All of a case's attempts are saved in one batch after the ladder finishes, so
              # created_at is identical across them and proves nothing. The gaps between
              # requested_at values are the evidence that the backoff really waited 1s and then
              # 2s, which is the one thing about a retry ladder you cannot verify by reading it.
              - column:
                  name: requested_at
                  type: TIMESTAMP
              - column:
                  name: latency_ms
                  type: INT
              - column:
                  name: provider_ref
                  type: VARCHAR(64)

        # ---------------------------------------------------------------------------------
        # Not strictly part of the provider work — a live crash found on the way, fixed here
        # because this changeset was being written anyway.
        #
        # issuing_country was VARCHAR(2), and the scenario corpus contains an application whose
        # identityDocument.issuingCountry is "PRT" (SIM-09, Ines Da Costa). MySQL in strict mode
        # refuses the insert rather than truncating, so the whole assessment throws, no
        # kyc_record row is written, and the applicant is REFERRED with a Java exception's
        # toString() as the explanation an operator has to read.
        #
        # Alpha-2 is the contract's ground rule and alpha-3 is a contract violation — but the
        # module's job is to REPORT a malformed field, not to crash on it, and it cannot report
        # what it cannot store. Three characters is enough to hold the bad value long enough to
        # say so.
        # ---------------------------------------------------------------------------------
        - modifyDataType:
            tableName: kyc_record
            columnName: issuing_country
            newDataType: VARCHAR(3)
        - addNotNullConstraint:
            tableName: kyc_record
            columnName: issuing_country
            columnDataType: VARCHAR(3)

      rollback:
        - dropColumn:
            tableName: third_party_attempts
            columnName: agency
        - dropColumn:
            tableName: third_party_attempts
            columnName: requested_at
        - dropColumn:
            tableName: third_party_attempts
            columnName: latency_ms
        - dropColumn:
            tableName: third_party_attempts
            columnName: provider_ref
        - modifyDataType:
            tableName: kyc_record
            columnName: issuing_country
            newDataType: VARCHAR(2)
        - addNotNullConstraint:
            tableName: kyc_record
            columnName: issuing_country
            columnDataType: VARCHAR(2)
