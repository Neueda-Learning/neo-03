spring:
  # Tests run against in-memory H2 in MySQL-compatibility mode — no Docker needed.
  datasource:
    url: jdbc:h2:mem:neotest;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Point the callback at a dead port so nothing escapes the JVM when one fires.
# ModuleApplicationTests runs the decision on the test thread (see its
# SameThreadExecutor), so the whole receive -> decide -> callback loop is deterministic here.
#
# `domain` and `mocked-dependencies` are set to real-looking values on purpose: they are the
# two fields on /info that a team must fill in for themselves, and a test asserting them is
# what notices if the plumbing that serves them ever breaks.
service:
  id: neo03
  name: Identity Verification (KYC) (test)
  team: Team 03
  domain: kyc
  orchestrator-url: http://localhost:9
  # The two government sources this module stands in for. Named individually rather than as one
  # "id-verification-provider", because they are two different systems with two different
  # contracts, and the register is only useful if it says what would actually have to be bought.
  mocked-dependencies: national-identity-agency, tax-agency

# Also a dead port. The identity agencies are a separate container that is NOT running during
# `mvn test`, and ModuleApplicationTests substitutes the client anyway — this is here so that a
# test which forgets to substitute it fails fast on a refused connection instead of reaching
# whatever happens to be listening on 8081 on the machine running the build.
id-provider:
  base-url: http://localhost:9
